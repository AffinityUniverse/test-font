<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 폰트 만들기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--fg:#1c1b19;--card:#fff;--line:#d9d6cd;--ac:#2d5be3;--mu:#77736a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#eeece6;--card:#232321;--line:#3a3935;--ac:#7c9bff;--mu:#9b978d}}
:root[data-theme="dark"]{--bg:#171716;--fg:#eeece6;--card:#232321;--line:#3a3935;--ac:#7c9bff;--mu:#9b978d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
#st{font-size:12px;color:var(--mu)}
main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1000px;margin:0 auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
button.on,button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs,.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{padding:4px 8px;min-height:30px;font-size:13px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px;max-height:52vh;overflow:auto}
.g{position:relative;padding:0;height:42px;font-size:17px;overflow:hidden}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.g.done{border-color:#2a9d5c}
.g.cur{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);min-width:0;flex:1}
input[type=color]{width:42px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none}
input[type=range]{flex:1;min-width:100px}
#wrap{position:relative;width:min(100%,480px);aspect-ratio:1;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px dashed #e79a9a;pointer-events:none}
#guide{position:absolute;left:0;right:0;top:7%;text-align:center;line-height:1;color:rgba(0,0,0,.14);pointer-events:none;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;user-select:none}#lab{font-size:13px;color:var(--mu);text-align:center;margin-top:6px}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body>
<header><h1>✍️ 내 폰트 만들기</h1><span id="st">불러오는 중…</span></header>
<main>
<section class="card">
  <div class="tabs" id="tabs"></div>
  <div id="grid"></div>
  <div class="row" id="addrow" hidden><input type="text" id="addin" placeholder="추가할 글자 (예: 가나다)"><button id="addbtn">추가</button></div>
  <div class="row"><span id="prog" style="font-size:13px;color:var(--mu)"></span></div>
  <div class="row"><input type="text" id="fname" value="MyFont" aria-label="폰트 이름"><button class="pri" id="exp">OTF 내보내기</button></div>
</section>
<section class="card">
  <div class="tools" id="tools">
    <button data-t="pen" class="sel">브러시</button><button data-t="eraser">지우개</button>
    <button data-t="line">직선</button><button data-t="rect">네모</button><button data-t="ellipse">동그라미</button>
  </div>
  <div class="row"><label><input type="checkbox" id="fill"> 도형 채우기</label>
    <input type="color" id="col" value="#000000" aria-label="색상"><label><input type="checkbox" id="gd" checked> 가이드 글자</label></div>
  <div class="row"><span style="font-size:13px">크기 <b id="sv">14</b></span><input type="range" id="size" min="1" max="60" value="14"></div>
  <div id="wrap"><canvas id="cv" width="384" height="384"></canvas>
    <div id="guide"></div><div class="gl" style="top:25%"></div><div class="gl" style="top:45%"></div><div class="gl" style="top:75%;border-color:#d33"></div></div>
  <div id="lab"></div>
  <div class="row" style="justify-content:center">
    <button id="undo">↩ 되돌리기</button><button id="clr">전체 지우기</button>
    <button id="up">🖼 이미지 올리기</button><input type="file" id="file" accept="image/*" hidden>
  </div>
  <div style="font-size:12px;color:var(--mu);text-align:center">빨간 선 = 기준선 · 색상은 무관, 그려진 모양이 그대로 글자가 됩니다</div>
</section>
</main>
<script>
const $=s=>document.querySelector(s),W=384,BASE=288,LS='fontlab:';
const rng=(a,b)=>Array.from({length:b.charCodeAt(0)-a.charCodeAt(0)+1},(_,i)=>String.fromCharCode(a.charCodeAt(0)+i));
const KS=[];{const d=new TextDecoder('euc-kr');for(let a=0xB0;a<=0xC8;a++)for(let b=0xA1;b<=0xFE;b++){const c=d.decode(new Uint8Array([a,b]));if(/[가-힣]/.test(c))KS.push(c)}}
const SETS={};[...'가까나다따라마바빠사싸아자짜차카타파하'].forEach((n,i)=>SETS[n]=KS.filter(c=>Math.floor((c.charCodeAt(0)-0xAC00)/588)===i));
Object.assign(SETS,{'자모':[...'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'],'A-Z':rng('A','Z'),'a-z':rng('a','z'),'0-9':rng('0','9'),'기호':[...'!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~']});
const cv=$('#cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
let cur='가',tab='가',tool='pen',color='#000000',size=14,fill=false,glyphs={},custom=[],hist=[],cd=null,drawing=false,p0,base,tmr;
const setStatus=t=>$('#st').textContent=t;

let idb;const idbo=()=>idb||(idb=new Promise((res,rej)=>{const r=indexedDB.open('fontlab',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const idbGet=async k=>{const d=await idbo();return new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const idbSet=async(k,v)=>{const d=await idbo();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
async function initStore(){try{const j=await idbGet('all');if(j){glyphs=j.g||{};custom=j.c||[]}setStatus('이 브라우저에 자동 저장 중')}catch(e){setStatus('⚠ 저장소를 사용할 수 없습니다')}}
async function persist(){try{await idbSet('all',{g:glyphs,c:custom});setStatus('✓ 저장됨')}catch(e){setStatus('⚠ 저장 실패')}}
const saveMeta=persist;

function chars(){return tab==='직접 추가'?custom:SETS[tab]}
function renderTabs(){$('#tabs').innerHTML=Object.keys(SETS).map(k=>`<button data-k="${k}" class="${k===tab?'sel':''}">${k}</button>`).join('');$('#addrow').hidden=tab!=='직접 추가'}
function renderGrid(){
  $('#grid').innerHTML=chars().map(c=>`<button class="g ${glyphs[c]?'done':''} ${c===cur?'cur':''}" data-c="${c.replace(/"/g,'&quot;')}">${glyphs[c]?`<img src="${glyphs[c]}" alt="">`:c.replace(/</g,'&lt;')}</button>`).join('');
  const all=[...Object.values(SETS).flat(),...custom];$('#prog').textContent=`완성 ${Object.keys(glyphs).length} / ${new Set(all).size} 글자`;
  $('#lab').textContent=`지금 그리는 글자: ${cur}`;const g=$('#guide');g.textContent=cur;g.style.fontSize=$('#wrap').clientWidth*.8+'px';
}
function blank(){return !ctx.getImageData(0,0,W,W).data.some((v,i)=>i%4===3&&v>0)}
function load(ch){cur=ch;ctx.clearRect(0,0,W,W);hist=[];if(glyphs[ch]){const i=new Image();i.onload=()=>ctx.drawImage(i,0,0);i.src=glyphs[ch]}renderGrid()}
function commit(){const ch=cur;blank()?delete glyphs[ch]:glyphs[ch]=cv.toDataURL();renderGrid();clearTimeout(tmr);tmr=setTimeout(()=>persist(ch),500)}
function snap(){hist.push(ctx.getImageData(0,0,W,W));if(hist.length>30)hist.shift()}
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}};
function style(e){ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=ctx.fillStyle=color;ctx.lineCap=ctx.lineJoin='round';
  ctx.lineWidth=(e&&e.pointerType==='pen'&&e.pressure)?size*(.4+e.pressure*1.2):size}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}snap();drawing=true;p0=pos(e);base=ctx.getImageData(0,0,W,W);
  if(tool==='pen'||tool==='eraser'){style(e);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p0.x+.01,p0.y);ctx.stroke()}});
cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);style(e);
  if(tool==='pen'||tool==='eraser'){ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p.x,p.y);ctx.stroke();p0=p;return}
  ctx.putImageData(base,0,0);style();ctx.beginPath();let x=p0.x,y=p0.y,w=p.x-x,h=p.y-y;
  if(e.shiftKey&&tool!=='line'){const m=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*m;h=Math.sign(h||1)*m}
  if(tool==='line'){ctx.moveTo(x,y);ctx.lineTo(p.x,p.y);ctx.stroke()}
  else{tool==='rect'?ctx.rect(x,y,w,h):ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,7);fill?ctx.fill():ctx.stroke()}});
const end=()=>{if(!drawing)return;drawing=false;ctx.globalCompositeOperation='source-over';commit()};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(!k)return;tab=k;renderTabs();renderGrid()};
$('#grid').onclick=e=>{const b=e.target.closest('.g');if(b)load(b.dataset.c)};
$('#tools').onclick=e=>{const t=e.target.dataset.t;if(!t)return;tool=t;[...$('#tools').children].forEach(b=>b.classList.toggle('sel',b.dataset.t===t))};
$('#gd').onchange=e=>$('#guide').style.display=e.target.checked?'':'none';window.addEventListener('resize',renderGrid);$('#fill').onchange=e=>fill=e.target.checked;$('#col').oninput=e=>color=e.target.value;
$('#size').oninput=e=>{size=+e.target.value;$('#sv').textContent=size};
$('#undo').onclick=()=>{const h=hist.pop();if(h){ctx.putImageData(h,0,0);commit()}};
$('#clr').onclick=()=>{snap();ctx.clearRect(0,0,W,W);commit()};
$('#addbtn').onclick=()=>{const all=new Set([...Object.values(SETS).flat(),...custom]);[...$('#addin').value].forEach(c=>{if(c.trim()&&!all.has(c)){custom.push(c);all.add(c)}});$('#addin').value='';saveMeta();renderGrid()};
$('#up').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{
  const t=document.createElement('canvas');t.width=t.height=W;const c=t.getContext('2d',{willReadFrequently:true});
  const k=Math.min(W/i.width,W/i.height)*.9;c.fillStyle='#fff';c.fillRect(0,0,W,W);c.drawImage(i,(W-i.width*k)/2,(W-i.height*k)/2,i.width*k,i.height*k);
  const d=c.getImageData(0,0,W,W),a=d.data,rgb=[parseInt(color.slice(1,3),16),parseInt(color.slice(3,5),16),parseInt(color.slice(5,7),16)];
  for(let j=0;j<a.length;j+=4){const l=(a[j]+a[j+1]+a[j+2])/3,on=l<150&&a[j+3]>100;a[j]=rgb[0];a[j+1]=rgb[1];a[j+2]=rgb[2];a[j+3]=on?255:0}
  c.putImageData(d,0,0);snap();ctx.drawImage(t,0,0);commit();URL.revokeObjectURL(i.src)};i.src=URL.createObjectURL(f);e.target.value=''};

const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
function dp(L,e=1){const n=L.length;let j=0,m=0;for(let i=1;i<n;i++){const d=(L[i][0]-L[0][0])**2+(L[i][1]-L[0][1])**2;if(d>m){m=d;j=i}}
 const k=new Uint8Array(n);k[0]=k[j]=1;
 const rec=(a,b)=>{let md=0,mi=-1;const A=L[a],B=L[b%n],dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy)||1;
  for(let i=a+1;i<b;i++){const d=Math.abs((L[i][0]-A[0])*dy-(L[i][1]-A[1])*dx)/l;if(d>md){md=d;mi=i}}
  if(md>e){k[mi]=1;rec(a,mi);rec(mi,b)}};rec(0,j);rec(j,n);return L.filter((_,i)=>k[i])}
const TB={1:'LB',2:'BR',3:'LR',4:'RT',5:'RTLB',6:'BT',7:'LT',8:'TL',9:'TB',10:'TLBR',11:'TR',12:'RL',13:'RB',14:'BL'};
function contours(a,W){const N=W+2,f=new Float32Array(N*N),T=.5,nx=new Map();
 for(let y=0;y<W;y++)for(let x=0;x<W;x++)f[(y+1)*N+x+1]=a[(y*W+x)*4+3]/255;
 const F=(x,y)=>f[y*N+x],h=(x,y)=>(y*N+x)*2,v=(x,y)=>(y*N+x)*2+1;
 const pe=id=>{const t=id&1,c=id>>1,x=c%N,y=(c/N)|0;if(!t){const u=F(x,y),w=F(x+1,y);return[x+(T-u)/(w-u)-.5,y-.5]}const u=F(x,y),w=F(x,y+1);return[x-.5,y+(T-u)/(w-u)-.5]};
 for(let y=0;y<N-1;y++)for(let x=0;x<N-1;x++){const i=(F(x,y)>=T?8:0)|(F(x+1,y)>=T?4:0)|(F(x+1,y+1)>=T?2:0)|(F(x,y+1)>=T?1:0);if(!i||i===15)continue;
  const E={T:h(x,y),B:h(x,y+1),L:v(x,y),R:v(x+1,y)},s=TB[i];for(let k=0;k<s.length;k+=2)nx.set(E[s[k]],E[s[k+1]])}
 const out=[],seen=new Set();for(const s of nx.keys()){if(seen.has(s))continue;const L=[];let e=s;while(e!==undefined&&!seen.has(e)){seen.add(e);L.push(pe(e));e=nx.get(e)}if(L.length>=8)out.push(dp(L))}return out}
function emit(P,p){const n=p.length;if(n<3)return;const sh=p.map((q,i)=>{const a=p[(i+n-1)%n],b=p[(i+1)%n],ux=q[0]-a[0],uy=q[1]-a[1],vx=b[0]-q[0],vy=b[1]-q[1];return(ux*vx+uy*vy)/((Math.hypot(ux,uy)*Math.hypot(vx,vy))||1)<.5});
 const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],k=sh.indexOf(true);
 if(k>=0){P.moveTo(p[k][0],p[k][1]);for(let j=1;j<=n;j++){const i=(k+j)%n,q=p[i];if(sh[i])P.lineTo(q[0],q[1]);else{const m=sh[(i+1)%n]?p[(i+1)%n]:mid(q,p[(i+1)%n]);P.quadraticCurveTo(q[0],q[1],m[0],m[1])}}}
 else{const s=mid(p[0],p[1]);P.moveTo(s[0],s[1]);for(let j=1;j<=n;j++){const q=p[j%n],m=mid(q,p[(j+1)%n]);P.quadraticCurveTo(q[0],q[1],m[0],m[1])}}P.closePath()}
function crc32(u){let t=crc32.t;if(!t){t=crc32.t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let c=-1;for(let i=0;i<u.length;i++)c=t[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(name,data){const nb=new TextEncoder().encode(name),crc=crc32(data),n=data.length,D=0x5821;
 const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,D,true);lh.setUint32(14,crc,true);lh.setUint32(18,n,true);lh.setUint32(22,n,true);lh.setUint16(26,nb.length,true);
 const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,D,true);ch.setUint32(16,crc,true);ch.setUint32(20,n,true);ch.setUint32(24,n,true);ch.setUint16(28,nb.length,true);
 const eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,1,true);eo.setUint16(10,1,true);eo.setUint32(12,46+nb.length,true);eo.setUint32(16,30+nb.length+n,true);
 return new Blob([lh,nb,data,ch,nb,eo],{type:'application/zip'})}
async function exportOTF(){
  const keys=Object.keys(glyphs);if(!keys.length){alert('먼저 글자를 하나 이상 그려 주세요.');return}
  setStatus('OTF 만드는 중… 0%');const S=1000/W,C=3,G=W/C,out=[];
  out.push(new opentype.Glyph({name:'.notdef',advanceWidth:600,path:new opentype.Path()}));
  out.push(new opentype.Glyph({name:'space',unicode:32,advanceWidth:300,path:new opentype.Path()}));
  const t=document.createElement('canvas');t.width=t.height=W;const c=t.getContext('2d',{willReadFrequently:true});
  let n=0;for(const ch of keys){if(++n%40===0){setStatus('OTF 만드는 중… '+Math.round(n/keys.length*100)+'%');await new Promise(r=>setTimeout(r,0))}
    c.clearRect(0,0,W,W);c.drawImage(await loadImg(glyphs[ch]),0,0);const a=c.getImageData(0,0,W,W).data;
    const p=new opentype.Path();let maxX=0;
    for(const L of contours(a,W)){const q=L.map(([x,y])=>[x*S,(BASE-y)*S]);q.forEach(o=>{if(o[0]>maxX)maxX=o[0]});emit(p,q)}
    const cp=ch.codePointAt(0),hangul=cp>=0x3130&&cp<=0x318f;
    out.push(new opentype.Glyph({name:'uni'+cp.toString(16).toUpperCase().padStart(4,'0'),unicode:cp,advanceWidth:hangul?1000:Math.max(300,Math.round(maxX+80)),path:p}))}
  const name=($('#fname').value||'MyFont').replace(/[^\w\-]/g,'')||'MyFont';
  const font=new opentype.Font({familyName:name,styleName:'Regular',unitsPerEm:1000,ascender:800,descender:-200,glyphs:out});
  const buf=font.toArrayBuffer();
  try{const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name+'.zip',data:zip(name+'.otf',new Uint8Array(buf))});setStatus('✓ '+name+'.zip 저장됨 (압축을 풀면 '+name+'.otf)')}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'font/otf'}));a.download=name+'.otf';a.click();setStatus('✓ 내보내기 완료')}
  }catch(e){setStatus('⚠ 내보내기 실패: '+(e.message||e.code||''))}
}
$('#exp').onclick=exportOTF;
renderTabs();load(cur);
(async()=>{await initStore();if(!drawing&&blank())load(cur);else renderGrid()})();
</script></body></html>
